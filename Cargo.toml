[package]
name = "rust-echo-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Windows x64 RIO echo client (Rust port of the C++ baseline)"
license = "MIT"

[lib]
name = "cec"
path = "src/lib.rs"

[[bin]]
name = "rust-echo-client"
path = "src/main.rs"

[dependencies]
windows = { git = "https://github.com/microsoft/windows-rs", default-features = false, features = ["winsock2", "ws2", "mswsockdef", "mswsock", "ioapiset", "minwinbase", "winbase", "memoryapi", "processthreadsapi", "synchapi", "handleapi", "errhandlingapi", "winnt", "windef", "minwindef", "basetsd", "winerror", "sysinfoapi", "libloaderapi", "wincon", "consoleapi", "securitybaseapi", "synchapi", "profileapi", "realtimeapiset"] }

[profile.release]
lto = true
codegen-units = 1
